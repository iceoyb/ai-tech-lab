<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具库 — AI 技术大拿实验室</title>
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <h1 class="logo">🧪 AI 技术大拿实验室</h1>
    <nav class="nav">
      <a href="../index.html">首页</a>
      <a href="../graph.html">知识图谱</a>
      <a href="index.html" class="active">工具库</a>
      <a href="../practices/">最佳实践</a>
      <a href="../papers/">论文精读</a>
      <a href="../weekly/">周报</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="page-header">
    <h2>🛠️ AI 工具库</h2>
    <p>经过实际使用验证的工具，有心得、有踩坑记录、有改进方案。</p>
  </div>
  
  <div id="toolList" class="item-list">
    <div class="update-skeleton" style="height: 100px; border-radius: 12px;"></div>
    <div class="update-skeleton" style="height: 100px; border-radius: 12px;"></div>
    <div class="update-skeleton" style="height: 100px; border-radius: 12px;"></div>
  </div>

  <h2 style="margin-top: 48px;">📦 每周产出的工具脚本</h2>
  <p>每周围绕一个知识节点生成、可直接运行的 Python 脚本。</p>
  <div id="scriptList" class="item-list"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>由 AI 技术大拿自驱动生成 · <a href="https://github.com/iceoyb/ai-tech-lab">GitHub</a></p>
  </div>
</footer>

<script>
// 工具库页面逻辑
// 数据来自本地生成的 tools.json，无用户输入
fetch('../data/tools.json')
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('toolList');
    if (!data.tools || data.tools.length === 0) {
      list.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 60px;">工具库正在积累中，每周打磨新工具...</p>';
      return;
    }
    list.innerHTML = data.tools.map(t => `
      <div class="item-card">
        <div class="item-main">
          <h3>${t.name}</h3>
          <p>${t.description || ''}</p>
          <div class="item-tags">
            <span class="item-tag">${t.category}</span>
            <span class="item-tag">使用 ${t.usage_count} 次</span>
            <span class="item-tag">成功率 ${Math.round((t.success_rate||0)*100)}%</span>
          </div>
        </div>
        <div class="item-meta">
          <div class="item-date">${(t.last_used||'').split('T')[0]}</div>
        </div>
      </div>
    `).join('');
  })
  .catch(e => {
    document.getElementById('toolList').innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 60px;">加载失败</p>';
  });

// 每周产出的工具脚本（tools.json 的 scripts 数组）
fetch('../data/tools.json')
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById('scriptList');
    const scripts = data.scripts || [];
    if (!scripts.length) {
      el.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 40px;">脚本正在积累中...</p>';
      return;
    }
    el.innerHTML = scripts.map(s => `
      <a href="${s.url}" class="item-card" download>
        <div class="item-main">
          <h3>${s.title || s.name}</h3>
          <p>${s.description || ''}</p>
          <div class="item-tags">
            <span class="item-tag">${s.category || '工具'}</span>
          </div>
        </div>
        <div class="item-meta">
          <div class="item-date">📦 下载 .py</div>
        </div>
      </a>
    `).join('');
  })
  .catch(e => {
    document.getElementById('scriptList').innerHTML = '';
  });
</script>
</body>
</html>
